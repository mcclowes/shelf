name: Release Shelf
on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
      candidate:
        type: string
        default: ""
      fingerprint:
        type: string
        default: ""
      nightly_tag:
        type: string
        default: ""
      nightly_version:
        type: string
        default: ""
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      id-token: write
      attestations: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_SHA: ${{ inputs.candidate }}
      NIGHTLY_FINGERPRINT: ${{ inputs.fingerprint }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      NIGHTLY_TAP_PATH: ${{ github.workspace }}/nightly-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}
      # No dependency cache in the release job, to avoid cache poisoning.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
        if: ${{ !inputs.nightly }}
      - run: node scripts/package-release.mjs
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Publish GitHub release
        if: ${{ !inputs.nightly }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.sha256 --verify-tag --notes-file release-notes.md

      - name: Check out the nightly tap
        if: ${{ inputs.nightly }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mcclowes/homebrew-shelf
          path: nightly-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Publish the verified nightly
        if: ${{ inputs.nightly }}
        env:
          TAP_GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly-release.mjs publish

  homebrew:
    if: ${{ !inputs.nightly }}
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      # The deploy key can write only to the tap repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcclowes/homebrew-shelf
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Verify release archive
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.sha256'
          shasum -a 256 -c shelf-*.tar.gz.sha256
          gh attestation verify shelf-*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Update formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d' ' -f1 shelf-*.tar.gz.sha256)"
          sed -i '' -E \
            -e "s#^  url \".*\"#  url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/shelf-$version.tar.gz\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"$sha\"#" \
            tap/Formula/shelf.rb
          git -C tap diff
          # brew tap clones the tap, so the update must be committed before it is installed.
          git -C tap diff --quiet && exit 0
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap commit -am "Dependency: update Shelf to $version"
      - name: Install, test, and audit formula
        run: |
          brew tap mcclowes/shelf "$PWD/tap"
          # Homebrew 7 refuses non-official taps until trusted; older releases lack the command.
          if brew commands | grep -qx trust; then brew trust --tap mcclowes/shelf; fi
          brew install mcclowes/shelf/shelf
          brew test mcclowes/shelf/shelf
          brew audit --strict mcclowes/shelf/shelf
      - name: Publish formula
        working-directory: tap
        run: git push
